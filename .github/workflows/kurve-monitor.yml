name: Kurve availability check

on:
  schedule:
    # Runs every 30 minutes, UTC. Adjust to taste - GitHub may delay a
    # scheduled run by a few minutes during high load, especially right
    # at the top of the hour.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Stops two runs from racing to restore/save the state cache at the same time.
concurrency:
  group: kurve-monitor
  cancel-in-progress: false

# The state file is no longer committed, so the job only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # kurve_units_seen.json is git-ignored, so the snapshot from the
      # previous run lives in the Actions cache instead. Caches can't be
      # overwritten, so each run saves under its own key and the next run
      # restores the newest one via the shared prefix.
      - name: Restore state from previous run
        uses: actions/cache/restore@v6
        with:
          path: kurve_units_seen.json
          key: kurve-state-${{ github.run_id }}
          restore-keys: |
            kurve-state-

      - name: Run monitor
        env:
          KURVE_DISCORD_WEBHOOK: ${{ secrets.KURVE_DISCORD_WEBHOOK }}
          KURVE_DISCORD_MENTION: ${{ secrets.KURVE_DISCORD_MENTION }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          KURVE_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.KURVE_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python kurve_monitor.py

      - name: Save state for next run
        if: always() && hashFiles('kurve_units_seen.json') != ''
        uses: actions/cache/save@v6
        with:
          path: kurve_units_seen.json
          key: kurve-state-${{ github.run_id }}
